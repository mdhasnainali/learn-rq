services:
  redis:
    image: redis:latest
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: worker/dockerfile
    container_name: rq_worker
    environment:
      - MYPYPATH=/app
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
    command: ["python", "-m", "worker.worker"]

  creator:
    build:
      context: .
      dockerfile: task_creator/dockerfile
    container_name: rq_task_creator
    environment:
      - MYPYPATH=/app
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
    command: ["python", "-m", "task_creator.task_creator"]